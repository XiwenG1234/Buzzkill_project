; PlatformIO Project Configuration File
; Buzzkill Project - ESP32-C6-DevKitM-1
;
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Environment the toolbar Build/Upload/Monitor buttons use. Switch to
; esp32-c6-devkitm-1 for the main app, or diag for the serial heartbeat.
default_envs = hwtest

[env:esp32-c6-devkitm-1]
; Using the pioarduino community fork of the espressif32 platform:
; the official PlatformIO release doesn't yet support the Arduino
; framework on ESP32-C6 boards. See https://github.com/pioarduino/platform-espressif32
; Pinned to a stable tagged release (not #develop, whose bleeding-edge
; esptool snapshot broke uploads against the published esp-pylib version).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-c6-devkitm-1
framework = arduino

monitor_speed = 115200

; Check with `pio device list` if the board's port changes.
upload_port = /dev/cu.usbmodem1101
monitor_port = /dev/cu.usbmodem1101

; The DevKitM-1 has no USB-UART bridge chip - Serial must be routed to the
; USB-Serial/JTAG peripheral explicitly, or output silently goes nowhere.
; ESP32-C6 only has USB-Serial/JTAG (not full USB-OTG like S2/S3), so this
; needs HW CDC mode (ARDUINO_USB_MODE=1), not native/OTG mode.
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1

; Excludes the other alternate mains (their own setup()/loop() would collide with main.cpp's).
build_src_filter = +<*> -<hwtest_main.cpp> -<diag_main.cpp>

; TODO: add libraries as they're chosen, e.g.:
; lib_deps =
;     adafruit/Adafruit NeoPixel      ; AudioVisual: addressable LEDs
;     h2zero/NimBLE-Arduino           ; Wireless: BLE link to the Flutter app

; Standalone hardware bring-up test: OLED + PAM8904 amp/speaker.
; Builds ONLY src/hwtest_main.cpp (not the main app's files).
; Run with: pio run -e hwtest -t upload -t monitor
[env:hwtest]
extends = env:esp32-c6-devkitm-1
build_src_filter = -<*> +<hwtest_main.cpp>
lib_deps =
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library

; Bare-minimum serial heartbeat, no libraries - for isolating Serial/USB-CDC
; issues from anything in the real test code.
[env:diag]
extends = env:esp32-c6-devkitm-1
build_src_filter = -<*> +<diag_main.cpp>
